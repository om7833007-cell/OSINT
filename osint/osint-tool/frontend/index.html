<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OSINT Recon</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>OSINT Recon</h1>
    <p class="subtitle">Domain, IP, email &amp; username reconnaissance</p>
  </header>

  <main>
    <section class="search-panel">
      <input id="target-input" type="text" placeholder="Enter a domain, email, IP, or username..." />
      <input id="purpose-input" type="text" placeholder="Purpose of this search (required)" />
      <button id="search-btn">Search</button>
      <p class="hint">A purpose note is required for every search and is stored locally with your case for accountability — it is never sent anywhere external.</p>
    </section>

    <section class="globe-panel">
      <div id="globe-container"></div>
      <div id="location-detail" class="hidden"></div>
    </section>

    <section id="results-panel"></section>

    <section id="flags-panel"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
  <script src="globe.js"></script>
  <script src="app.js"></script>
</body>
</html>
